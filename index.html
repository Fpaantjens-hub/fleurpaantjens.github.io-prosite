<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYPOtheque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            TYPOtheque       
        </div>

        <button class="menu-button">
            ☰
        </button>

        <div class="nav-right"> 
            <button class="login-button">
            Log In
            </button>

            <button class="search-button" aria-label="Zoeken">
                <svg width="28" height="28" viewBox="0 0 24 24"
                fill="none" stroke=" currentColor"
                stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>

                </svg>
            </button>
        </div>

    </header>
    
    <main>
        <section class="hero"> 
            <div class="hero-content">
                <h1> Chairman</h1> 
            </div>
        </section>

        <section class="categories">
            
            <div class="card all-fonts">
                <h2> All Fonts</h2>
            <div class="font-stack">
                <div class="font-paper paper-1">
                    <span>A</span>
                    <span>a</span>
            </div>

            <div class="font-paper paper-2"></div>
            <div class="font-paper paper-3"></div>
            <div class="font-paper paper-4"></div>
            </div>

            </div>

            <div class="card global-fonts">
                <h2> Global Fonts</h2>

                <div class="color-wheel"></div>
            </div>

            <div class="card variable-fonts">
                <h2> Variable Fonts</h2>

                <div class="variable-example">
                    AAAA
                </div>

            </div>
         <div class="card smart-fonts">
            <h2>Smart Fonts</h2>

            <div class="smart-example">
                <span>T</span>
                <b>+</b>
                <span>T</span>
                <b>+</b>
                <span>T</span>
                <b>+</b>
                <span>T</span>

            </div>
         </div>

         <div class="card superfamilies">
            <h2>superfamilies</h2>

            <div class="family-example">
                <span>T</span>
                <span>T</span>
                <span>T</span>
                <span>T</span>
            </div>
         </div>

         <div class="card legibility-fonts">
            <h2>legibility Fonts</h2>

            <div class="legibility-example">
                01101
            </div>
         </div>

         <div class="card optical-sizes">
            <h2> Optical Sizes</h2>

            <div class="optical-example">
                <span>A</span>
                <span>A</span>
                <span>A</span>
                <span>A</span>
            </div>
         </div>

        </section>
    </main>



    <script src="script.js"></script>
</body>
</html>
